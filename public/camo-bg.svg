<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <!-- MultiCam Fabric Ripstop / Twill Weave Texture -->
    <filter id="fabric-weave" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8 0.8" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.15   0 0 0 0 0.14   0 0 0 0 0.11   0 0 0 0.12 0" />
      <feBlend mode="multiply" in="SourceGraphic" result="blend" />
    </filter>

    <!-- Soft Blur for Under-Layers (the airbrushed look of MultiCam gradient transitions) -->
    <filter id="soft-camo-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" />
    </filter>

    <filter id="mid-camo-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" />
    </filter>

    <!-- Linear & Radial Gradients replicating MultiCam gradual transitions -->
    <linearGradient id="tan-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8bc94" />
      <stop offset="35%" stop-color="#d4c9a5" />
      <stop offset="70%" stop-color="#c1b48b" />
      <stop offset="100%" stop-color="#cebf98" />
    </linearGradient>

    <linearGradient id="grad-green" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#80955e" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#6f834f" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#55663b" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="grad-coyote" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8f694a" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#7c5738" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#68472c" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Ripstop Grid Pattern -->
    <pattern id="ripstop-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#251e16" stroke-width="0.35" opacity="0.12" />
    </pattern>
  </defs>

  <!-- ================= BASE CANVAS: MULTICAM SAND/TAN ================= -->
  <rect width="900" height="900" fill="url(#tan-base)" />

  <!-- Base tone tonal variations (large organic washes) -->
  <g opacity="0.4" filter="url(#soft-camo-blur)">
    <ellipse cx="200" cy="180" rx="220" ry="140" fill="#bcaa80" />
    <ellipse cx="700" cy="250" rx="260" ry="160" fill="#ded4b3" />
    <ellipse cx="350" cy="650" rx="280" ry="180" fill="#baa97d" />
    <ellipse cx="800" cy="750" rx="200" ry="150" fill="#d9ceab" />
  </g>

  <!-- ================= LAYER 1: LARGE BLURRED MID-TONE SAGE & COYOTE FIELDS ================= -->
  <!-- Foliage Green blurred cloud blotches -->
  <g filter="url(#soft-camo-blur)" opacity="0.88">
    <!-- Green zone top left -->
    <path d="M-50,60 Q120,20 280,70 T480,40 Q620,90 540,220 T360,280 Q200,340 80,260 T-60,180 Z" fill="#798f59" />
    <!-- Green zone mid right -->
    <path d="M420,320 Q600,280 750,340 T950,300 Q980,460 840,520 T620,540 Q460,590 400,480 T420,320 Z" fill="#728751" />
    <!-- Green zone bottom left -->
    <path d="M20,580 Q180,520 320,600 T420,780 Q350,920 180,920 T-40,840 Q-80,700 20,580 Z" fill="#7b915a" />
    <!-- Green zone center / diagonal -->
    <path d="M260,340 Q400,290 520,380 T600,500 Q480,580 340,540 T220,440 Z" fill="#889d67" />
  </g>

  <!-- Coyote Brown & Clay blurred cloud blotches -->
  <g filter="url(#soft-camo-blur)" opacity="0.86">
    <!-- Brown zone top right -->
    <path d="M500,40 Q680,-10 820,50 T960,180 Q920,320 780,340 T600,260 Q480,180 500,40 Z" fill="#8b6849" />
    <!-- Brown zone center left -->
    <path d="M-20,320 Q140,260 260,340 T340,480 Q260,600 120,580 T-60,480 Z" fill="#805d3f" />
    <!-- Brown zone bottom right -->
    <path d="M480,620 Q660,560 800,640 T950,760 Q900,920 740,940 T540,840 Q440,740 480,620 Z" fill="#8f694a" />
    <!-- Brown mid-patch -->
    <path d="M300,180 Q440,140 540,220 T500,340 Q380,380 280,300 Z" fill="#9b7654" />
  </g>

  <!-- ================= LAYER 2: DEFINED CAMO SHAPES (SEMI-SOFT EDGES) ================= -->
  <!-- Dark Olive & Sage defined horizontal patches -->
  <g filter="url(#mid-camo-blur)" opacity="0.92">
    <!-- Horizontal green drift across top -->
    <path d="M-20,120 C100,90 180,150 290,130 C400,110 470,160 560,140 C660,120 720,170 820,140 C870,125 920,150 950,140 L950,220 C880,240 800,200 710,230 C600,260 520,210 410,240 C300,270 200,210 90,250 C30,270 -10,240 -30,220 Z" fill="#697c49" />
    
    <!-- Organic green patch mid-center -->
    <path d="M180,440 C280,400 380,460 490,420 C580,390 670,440 760,410 C820,390 880,430 920,410 L920,490 C850,520 770,480 680,510 C580,540 490,490 390,520 C290,550 190,500 120,530 Z" fill="#5c6e40" />

    <!-- Organic green bottom left to center -->
    <path d="M50,720 C160,680 260,740 370,700 C460,670 540,720 640,690 L640,780 C540,810 450,770 350,810 C250,840 150,790 40,830 Z" fill="#667946" />
  </g>

  <!-- Coyote Brown & Earth defined horizontal shapes -->
  <g filter="url(#mid-camo-blur)" opacity="0.92">
    <!-- Brown mid-right drift -->
    <path d="M380,240 C490,200 600,260 710,220 C800,190 870,240 940,210 L940,310 C860,340 780,290 680,330 C580,360 480,310 370,340 Z" fill="#755234" />
    
    <!-- Brown lower-left drift -->
    <path d="M-20,480 C90,440 200,500 310,460 C400,430 480,480 560,450 L560,540 C470,570 380,530 280,570 C180,600 80,550 -20,590 Z" fill="#7a5739" />

    <!-- Brown bottom right -->
    <path d="M460,740 C570,700 680,760 790,720 C850,700 900,740 940,720 L940,830 C870,860 790,820 700,850 C600,880 500,830 420,860 Z" fill="#845f3f" />
  </g>

  <!-- ================= LAYER 3: CRISP MULTICAM ESPORESSO/BLACK HORIZONTAL MARKS ================= -->
  <!-- These are the sharp, horizontal irregular slashes and spots characteristic of MultiCam -->
  <g fill="#251a11" opacity="0.94">
    <!-- Macro horizontal dark slash clusters -->
    <!-- Top row -->
    <path d="M120,95 Q180,85 240,92 Q260,94 280,90 Q295,95 270,102 Q210,108 150,104 Q130,102 120,95 Z" />
    <path d="M290,92 Q315,88 335,93 Q325,100 295,98 Z" />
    <path d="M60,115 Q90,110 115,116 Q100,123 70,122 Z" />
    <path d="M580,75 Q640,68 710,74 Q740,77 720,85 Q660,88 600,84 Z" />
    <path d="M730,76 Q760,72 785,78 Q770,85 740,84 Z" />

    <!-- Second row (Y: 180 - 280) -->
    <path d="M380,190 C430,180 490,195 540,185 C570,180 595,190 580,200 C530,208 470,198 420,204 C390,206 375,198 380,190 Z" />
    <path d="M560,210 Q610,202 650,212 Q630,222 580,220 Z" />
    <path d="M160,240 Q220,230 290,238 Q320,242 300,250 Q240,254 180,250 Q150,248 160,240 Z" />
    <path d="M40,260 Q80,252 110,260 Q90,270 50,268 Z" />
    <path d="M720,240 C780,230 840,245 890,235 C910,238 890,248 840,252 C790,255 740,248 720,240 Z" />

    <!-- Third row (Y: 300 - 450) -->
    <path d="M460,340 C520,330 600,345 660,336 C700,330 730,342 710,352 C650,360 580,350 510,358 C470,360 450,350 460,340 Z" />
    <path d="M220,360 Q270,350 330,358 Q360,364 340,372 Q280,375 240,372 Q210,370 220,360 Z" />
    <path d="M80,390 Q140,380 190,388 Q170,398 110,398 Z" />
    <path d="M760,380 Q810,372 850,382 Q830,392 780,390 Z" />
    <path d="M340,430 C400,420 460,435 520,425 C550,420 570,430 555,440 C500,448 440,438 380,444 C350,446 335,438 340,430 Z" />

    <!-- Fourth row (Y: 480 - 620) -->
    <path d="M40,510 C100,500 180,515 240,506 C280,500 310,512 290,522 C230,530 160,520 90,528 C60,530 35,520 40,510 Z" />
    <path d="M520,510 Q580,500 640,510 Q670,515 650,524 Q590,528 540,524 Z" />
    <path d="M700,530 Q750,522 790,532 Q770,542 720,540 Z" />
    <path d="M250,570 Q310,560 360,570 Q340,580 280,580 Z" />
    <path d="M600,590 C660,580 730,595 790,585 C820,580 840,592 825,602 C770,610 700,600 640,606 C610,608 595,600 600,590 Z" />
    <path d="M120,620 Q170,610 220,620 Q200,630 150,630 Z" />

    <!-- Fifth row (Y: 650 - 850) -->
    <path d="M360,670 C420,660 500,675 560,666 C600,660 630,672 610,682 C550,690 480,680 410,688 C380,690 355,680 360,670 Z" />
    <path d="M700,680 Q760,670 820,680 Q800,692 740,690 Z" />
    <path d="M60,710 Q120,700 170,710 Q150,722 90,722 Z" />
    <path d="M200,750 C260,740 330,755 390,746 C420,740 440,752 425,762 C370,770 300,760 240,766 C210,768 195,760 200,750 Z" />
    <path d="M520,760 Q580,750 630,762 Q610,772 550,772 Z" />
    <path d="M680,780 C740,770 810,785 870,775 C895,778 875,790 820,794 C770,796 710,790 680,780 Z" />
    <path d="M300,820 Q360,810 410,822 Q390,832 330,832 Z" />
    <path d="M80,840 Q140,830 200,840 Q180,852 110,852 Z" />
    <path d="M580,840 C640,830 710,845 770,836 C800,832 820,844 800,852 C750,860 680,852 620,856 Z" />
  </g>

  <!-- Small espresso dots / satellite splatter flecks (MultiCam micro-pattern) -->
  <g fill="#21170f" opacity="0.95">
    <circle cx="105" cy="90" r="3.5" /><circle cx="115" cy="85" r="2.5" /><circle cx="285" cy="85" r="3" />
    <circle cx="345" cy="96" r="3" /><circle cx="355" cy="102" r="2" /><circle cx="560" cy="70" r="3.5" />
    <circle cx="795" cy="82" r="2.5" /><circle cx="810" cy="78" r="3.5" /><circle cx="365" cy="195" r="3" />
    <circle cx="660" cy="208" r="3.5" /><circle cx="672" cy="216" r="2" /><circle cx="140" cy="235" r="3.5" />
    <circle cx="310" cy="235" r="3" /><circle cx="325" cy="242" r="2" /><circle cx="705" cy="245" r="3.5" />
    <circle cx="905" cy="232" r="2.5" /><circle cx="440" cy="335" r="3.5" /><circle cx="720" cy="335" r="3" />
    <circle cx="205" cy="355" r="3.5" /><circle cx="70" cy="385" r="3" /><circle cx="860" cy="378" r="3.5" />
    <circle cx="325" cy="425" r="3.5" /><circle cx="580" cy="425" r="3" /><circle cx="592" cy="433" r="2" />
    <circle cx="25" cy="505" r="3.5" /><circle cx="320" cy="508" r="3" /><circle cx="505" cy="505" r="3" />
    <circle cx="660" cy="510" r="3.5" /><circle cx="800" cy="528" r="2.5" /><circle cx="235" cy="565" r="3.5" />
    <circle cx="375" cy="565" r="3" /><circle cx="580" cy="585" r="3.5" /><circle cx="850" cy="582" r="3" />
    <circle cx="105" cy="615" r="3" /><circle cx="345" cy="665" r="3.5" /><circle cx="620" cy="665" r="3" />
    <circle cx="830" cy="678" r="3.5" /><circle cx="45" cy="705" r="3" /><circle cx="185" cy="745" r="3.5" />
    <circle cx="435" cy="742" r="3" /><circle cx="505" cy="755" r="3.5" /><circle cx="665" cy="775" r="3" />
    <circle cx="880" cy="770" r="3.5" /><circle cx="285" cy="815" r="3" /><circle cx="65" cy="835" r="3.5" />
    <circle cx="565" cy="835" r="3" /><circle cx="785" cy="832" r="3.5" /><circle cx="835" cy="850" r="2.5" />
  </g>

  <!-- Vertical/diagonal tiny twigs and sticks characteristic of MultiCam -->
  <g stroke="#261b12" stroke-width="2.2" stroke-linecap="round" opacity="0.88">
    <line x1="240" y1="88" x2="248" y2="108" />
    <line x1="740" y1="70" x2="732" y2="90" />
    <line x1="530" y1="185" x2="540" y2="208" />
    <line x1="270" y1="232" x2="262" y2="252" />
    <line x1="840" y1="235" x2="850" y2="256" />
    <line x1="620" y1="335" x2="612" y2="358" />
    <line x1="160" y1="382" x2="168" y2="405" />
    <line x1="480" y1="422" x2="490" y2="445" />
    <line x1="210" y1="502" x2="202" y2="526" />
    <line x1="740" y1="585" x2="748" y2="608" />
    <line x1="530" y1="662" x2="522" y2="685" />
    <line x1="330" y1="742" x2="340" y2="766" />
    <line x1="720" y1="832" x2="712" y2="855" />
  </g>

  <!-- ================= LAYER 4: CRISP MULTICAM CREAM/OFF-WHITE HIGHLIGHTS ================= -->
  <!-- These are the distinctive light cream spots, dashes, and flecks in MultiCam -->
  <g fill="#f5f0e3" opacity="0.95">
    <!-- Highlights near or adjacent to dark elements -->
    <path d="M145,108 Q175,104 200,108 Q185,114 150,113 Z" />
    <path d="M625,88 Q660,84 690,88 Q670,94 635,94 Z" />
    <path d="M440,208 Q480,202 510,207 Q490,214 450,214 Z" />
    <path d="M205,254 Q245,248 275,253 Q255,260 215,260 Z" />
    <path d="M760,252 Q800,246 830,251 Q810,258 770,258 Z" />
    <path d="M530,360 Q570,354 605,359 Q585,366 540,366 Z" />
    <path d="M260,375 Q295,370 325,374 Q310,380 270,380 Z" />
    <path d="M400,446 Q440,440 475,445 Q455,452 410,452 Z" />
    <path d="M120,530 Q160,524 195,529 Q175,536 130,536 Z" />
    <path d="M670,608 Q710,602 745,607 Q725,614 680,614 Z" />
    <path d="M430,690 Q470,684 505,689 Q485,696 440,696 Z" />
    <path d="M270,768 Q310,762 345,767 Q325,774 280,774 Z" />
    <path d="M740,796 Q780,790 815,795 Q795,802 750,802 Z" />
    <path d="M645,858 Q685,852 720,857 Q700,864 655,864 Z" />

    <!-- Isolated MultiCam cream dot clusters -->
    <!-- Cluster 1 -->
    <circle cx="215" cy="115" r="3.5" /><circle cx="225" cy="122" r="2.5" /><circle cx="205" cy="125" r="2" />
    <!-- Cluster 2 -->
    <circle cx="705" cy="95" r="3.5" /><circle cx="718" cy="102" r="2" /><circle cx="695" cy="105" r="2.5" />
    <!-- Cluster 3 -->
    <circle cx="525" cy="216" r="3.5" /><circle cx="538" cy="224" r="2.5" /><circle cx="515" cy="226" r="2" />
    <!-- Cluster 4 -->
    <circle cx="290" cy="262" r="3.5" /><circle cx="302" cy="268" r="2" /><circle cx="280" cy="272" r="2.5" />
    <!-- Cluster 5 -->
    <circle cx="845" cy="260" r="3.5" /><circle cx="858" cy="266" r="2.5" /><circle cx="835" cy="270" r="2" />
    <!-- Cluster 6 -->
    <circle cx="620" cy="368" r="3.5" /><circle cx="632" cy="375" r="2.5" /><circle cx="610" cy="378" r="2" />
    <!-- Cluster 7 -->
    <circle cx="340" cy="382" r="3.5" /><circle cx="352" cy="388" r="2" /><circle cx="330" cy="392" r="2.5" />
    <!-- Cluster 8 -->
    <circle cx="490" cy="455" r="3.5" /><circle cx="502" cy="462" r="2.5" /><circle cx="480" cy="465" r="2" />
    <!-- Cluster 9 -->
    <circle cx="210" cy="538" r="3.5" /><circle cx="222" cy="545" r="2" /><circle cx="200" cy="548" r="2.5" />
    <!-- Cluster 10 -->
    <circle cx="760" cy="616" r="3.5" /><circle cx="772" cy="622" r="2.5" /><circle cx="750" cy="625" r="2" />
    <!-- Cluster 11 -->
    <circle cx="520" cy="698" r="3.5" /><circle cx="532" cy="705" r="2.5" /><circle cx="510" cy="708" r="2" />
    <!-- Cluster 12 -->
    <circle cx="360" cy="776" r="3.5" /><circle cx="372" cy="782" r="2" /><circle cx="350" cy="786" r="2.5" />
    <!-- Cluster 13 -->
    <circle cx="830" cy="804" r="3.5" /><circle cx="842" cy="810" r="2.5" /><circle cx="820" cy="814" r="2" />
    <!-- Cluster 14 -->
    <circle cx="735" cy="866" r="3.5" /><circle cx="748" cy="872" r="2.5" /><circle cx="725" cy="875" r="2" />
  </g>

  <!-- Fine cream speckles across tan areas -->
  <g fill="#f2ecdc" opacity="0.85">
    <circle cx="50" cy="40" r="2.5" /><circle cx="310" cy="50" r="2" /><circle cx="480" cy="30" r="2.5" />
    <circle cx="880" cy="50" r="2" /><circle cx="150" cy="170" r="2.5" /><circle cx="760" cy="180" r="2" />
    <circle cx="30" cy="320" r="2.5" /><circle cx="410" cy="290" r="2" /><circle cx="870" cy="330" r="2.5" />
    <circle cx="260" cy="470" r="2" /><circle cx="680" cy="460" r="2.5" /><circle cx="120" cy="660" r="2" />
    <circle cx="470" cy="610" r="2.5" /><circle cx="890" cy="640" r="2" /><circle cx="280" cy="700" r="2.5" />
    <circle cx="630" cy="730" r="2" /><circle cx="150" cy="810" r="2.5" /><circle cx="460" cy="820" r="2" />
    <circle cx="850" cy="890" r="2.5" /><circle cx="20" cy="880" r="2" />
  </g>

  <!-- ================= LAYER 5: MILITARY RIPSTOP FABRIC WEAVE TEXTURE ================= -->
  <rect width="900" height="900" fill="url(#ripstop-grid)" />
  <rect width="900" height="900" fill="#000000" opacity="0.04" filter="url(#fabric-weave)" />
</svg>
